name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "pytest selector forwarded to tox posargs (empty = full suite)"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-22.04"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

        include:
          # no arm64 CPython 3.7 exists; run the x64 build under Rosetta
          - os: "macos-latest"
            python-version: "3.7"
            architecture: "x64"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        if: matrix.os != 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      # actions/setup-python's x64 CPython 3.7 links x64-Homebrew gettext, absent
      # on arm64 macOS; python.org's self-contained Intel build runs under Rosetta
      - name: Set up python (x64 macOS, python.org installer)
        if: matrix.os == 'macos-latest' && matrix.architecture == 'x64'
        run: |
          curl -sSLo "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          mkdir -p "$RUNNER_TEMP/pybin"
          ln -s /Library/Frameworks/Python.framework/Versions/3.7/bin/python3 "$RUNNER_TEMP/pybin/python"
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"

      # arm64 macOS: actions/setup-python has no prebuilt CPython 3.8/3.9 there
      - name: Set up python (arm64 macOS)
        if: matrix.os == 'macos-latest' && matrix.architecture != 'x64'
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox "setuptools==65.5.1"
          pip list

      - name: Run tests
        run: tox -- -ra ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        run: |
          echo "wheel==0.38.4" > "$RUNNER_TEMP/build-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"
          # release build: clear the dev tag (published sdist ships tag_build empty)
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          pip install build
          python -m build
          ls -l dist

      - name: Upload distributions
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
